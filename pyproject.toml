[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccmcp"
version = "0.1.0"
description = "Claude Code MCP knowledge base with hybrid vector search"
requires-python = ">=3.12"
dependencies = [
  "qdrant-client>=1.9",
  "fastembed>=0.3",
  "watchdog>=4.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "readability-lxml>=0.8",
  "google-api-python-client>=2.130",
  "google-auth>=2.29",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "click>=8.1",
  "rich>=13.0",
  "mcp[cli]>=1.0",
  "prometheus-client>=0.20",
  "uvicorn[standard]>=0.30",
  "lxml[html_clean]>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "respx>=0.21",
]

[project.scripts]
ccmcp = "ccmcp.__main__:cli"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running Qdrant instance",
  "slow: downloads ML models, skip in CI",
]
