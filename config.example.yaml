# ccmcp — Configuration Template
# Copy this to config.yaml and edit for your environment.
# config.yaml is gitignored — never commit it.

qdrant:
  url: "http://localhost:6333"
  collection: "techdocs"
  # api_key: ""  # only needed for Qdrant Cloud

embedding:
  dense_model: "BAAI/bge-small-en-v1.5"
  sparse_model: "Qdrant/bm25"
  rotation_matrix: "ccmcp/rotation_matrix.npy"  # generated by: python -m ccmcp setup

extraction:
  backend: "none"   # "none" | "ollama" | "claude_api"
  ollama:
    model: "qwen2.5:14b"
    base_url: "http://localhost:11434"
    context_window: 32768
  claude_api:
    model: "claude-sonnet-4-20250514"
    # Set ANTHROPIC_API_KEY env var — do not put key here

sources:
  filesystem:
    enabled: true
    roots:
      # - "/home/user/docs"
      # - "/home/user/projects/myrepo"
    watch: true   # set false to run one-shot scans only
    extensions:
      - ".md"
      - ".rst"
      - ".txt"
      - ".py"
      - ".go"
      - ".rs"
      - ".js"
      - ".ts"
      - ".yaml"
      - ".yml"
      - ".json"
      - ".c"
      - ".cpp"
      - ".h"
    ignore:
      - "node_modules"
      - ".git"
      - "__pycache__"
      - "*.pyc"
      - "build"
      - "dist"
      - ".venv"
      - "*.egg-info"

  web:
    enabled: false
    urls: []
      # - "https://wiki.internal/sr-linux/qos"
    sitemaps: []
      # - "https://wiki.internal/sitemap.xml"
    crawl_depth: 0      # 0 = no crawl, 1 = follow links one level deep
    rate_limit_ms: 500
    user_agent: "kb-ingestion/1.0"

  google_drive:
    enabled: false
    credentials_file: ""  # absolute path to service account JSON
    folders: []
      # - id: "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms"
      #   name: "SR Linux Docs"
    poll_interval_min: 15

power:
  skip_full_scan_on_battery: true   # macOS only; ignored on Linux

state:
  db_path: "~/.local/share/kb/state.db"
  artifact_ttl_days: 30
