# ccmcp — Configuration Template
# Copy to config.yaml and edit. config.yaml is gitignored — never commit it.
# Most settings have sensible defaults and can be omitted.

qdrant:
  url: "http://localhost:6333"
  collection: "techdocs"
  # api_key: ""  # Qdrant Cloud only

embedding:
  dense_model: "BAAI/bge-small-en-v1.5"
  sparse_model: "Qdrant/bm25"
  rotation_matrix: "/data/rotation_matrix.npy"  # generated by: ccmcp setup

extraction:
  backend: "none"   # "none" | "ollama" | "claude_api"  (Phase 2, not yet active)

sources:
  filesystem:
    enabled: true
    # paths: overridden by CCMCP_SOURCE_PATH env var when running in Docker.
    # Set here for local dev without Docker.
    # Plain string or object with optional scope metadata:
    paths: []
      # - /home/user/code                 # plain path, name defaults to directory name
      # - path: /home/user/api-server     # with scope metadata
      #   name: api-server
      #   tags: [go, backend]
      #   include: [shared-lib]           # pull in chunks tagged shared-lib at query time
    watch: true
    poll_interval: 30  # seconds between filesystem polls (used in Docker)
    # When true (default), each path's .gitignore is honoured during scan and
    # watch — files matched by a gitignore pattern (anchored, **, !-negated)
    # are not indexed. Set false to ignore .gitignore files entirely.
    respect_gitignore: true
    extensions:
      - ".md"
      - ".rst"
      - ".txt"
      - ".py"
      - ".go"
      - ".rs"
      - ".js"
      - ".ts"
      - ".yaml"
      - ".yml"
      - ".c"
      - ".cpp"
      - ".cc"     # C++ — function-level chunked
      - ".cxx"    # C++ — function-level chunked
      - ".h"
      - ".hpp"    # C++ header — function-level chunked
      - ".hh"     # C++ header — function-level chunked
      # .json is NOT in the defaults: lockfiles and generated schemas inflate
      # the index with low-value chunks. Add it back here only if you index
      # hand-written JSON docs (e.g. RFC-style schemas) and want them found.
    ignore:
      - "node_modules"
      - ".git"
      - "__pycache__"
      - "*.pyc"
      - "build"
      - "dist"
      - ".venv"
      - "*.egg-info"

  web:
    enabled: false
    urls: []
    sitemaps: []
    crawl_depth: 0
    rate_limit_ms: 500
    user_agent: "ccmcp-ingestion/1.0"

  google_drive:
    enabled: false
    credentials_file: ""  # absolute path to service account JSON
    folders: []
      # - id: "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms"
      #   name: "My Docs"
    poll_interval_min: 15

state:
  db_path: "/data/state.db"
  artifact_ttl_days: 30

mcp:
  port: 7700
  host: "0.0.0.0"
  result_limit: 10
